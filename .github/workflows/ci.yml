name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bubblewrap (Linux snippet sandbox)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Configure git
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global core.autocrlf false
      - name: Lint
        run: npm run lint
      - name: Unit and end-to-end tests
        run: npm test
      - name: Question packs
        run: npm run pack-ci
      - name: Doctor
        run: node bin/diffdojo doctor

  ui:
    name: In-app UI (Claude Code plugin tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The plugin UI API is version-sensitive: keep this pinned and bump it deliberately.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.326
      - name: Validate plugin
        run: claude plugin validate .
      - name: UI tests
        run: npm run test:ui
